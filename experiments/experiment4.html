<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taj Hotel , Mumbai</title>
</head>
<body>
    <center>
    <fieldset>
        <h1>Hotel Booking Form</h1> 
        <form action = "./thankyou.html" method ="get" >
        <label for="name"  > Full Name :</label> 
        <input type="name" name="name" id="name" >

        <br><br>
        <label for="email" >Email :</label>
        <input type="email" name="email" id="email" >

        <br><br>
        <label for="tel" >Phone :</label>
        <input type="tel" name="tel" id="tel" >


        <br><br>
        <label for="date" >Check In Date :</label>
        <input  type="date" name="date" id="date" >

        <br><br>
        <label for="date" >Check Out Date</label>
        <input type="date" name="date" id="date" >


        <br><br>
        <label for ="lang" >Select Room :</label>
        <select name="lang" id="lang" >
            <option value ="Single Luxury" >Single Luxury</option>
            <option value = "Double luxury" >Double Luxury</option>
            <option value ="Single Contempary">Single Contempary</option>
            <option value ="Double Contempary" >Double Contempary</option>

        </select>

        <br><br>
        <label for="number" >Number</label>
        <input type="number" name="number" name="number" >

        <br><br>
        <center><label for="add" >Special Request :</label></center>
        <textarea name="add"  id="add" ></textarea>

        <br><br>
        <label for="Submit" ></label>
        <input type="Submit" value="Book Now" >
        <input type ="reset" value="Reset Form" > 


    </fieldset>
    </center>
</form>
</body>
</html>
